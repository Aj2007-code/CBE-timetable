<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<title>Mid-Sem Room Finder — Autumn 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#11161c;--surface:#19212a;--surface2:#202a35;--line:#2b3641;--text:#e8e6e1;--dim:#a9b3bd;--faint:#74818e;--teal:#5fd0c2;--tealDim:#16332f;--amber:#f0b36f;--amberDim:#3a2918;--rose:#f08b91;--roseDim:#3a2024;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 70px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--dim);font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:9px}
.back:hover{color:var(--teal);border-color:var(--teal)}
h1{font-size:clamp(1.35rem,4vw,1.8rem);margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--dim);font-size:.9rem}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 180px 150px;gap:9px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.roll-field{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 7px}
.roll-field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(95,208,194,.08)}
.roll-field input{flex:1 1 150px;min-width:130px;height:32px;border:0;background:transparent;padding:0 4px;box-shadow:none}
.roll-field input:focus{border:0;box-shadow:none}
.roll-chip{display:inline-flex;align-items:center;gap:6px;background:var(--tealDim);color:var(--teal);border:1px solid rgba(95,208,194,.18);border-radius:999px;padding:4px 7px 4px 10px;font:600 10px "IBM Plex Mono",monospace;white-space:nowrap}
.roll-chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;font:700 14px/1 "IBM Plex Mono",monospace;padding:0 2px}
.roll-chip button:hover{color:var(--rose)}
.helper{margin:7px 2px 0;color:var(--faint);font-size:11px}
.student-result{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:10px 0;overflow:hidden}
.student-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--line)}
.student-roll{font:700 12px "IBM Plex Mono",monospace;color:var(--teal)}
.student-count{font:600 10px "IBM Plex Mono",monospace;color:var(--faint)}
.exam-row{display:grid;grid-template-columns:145px 105px 1fr;gap:12px;align-items:center;padding:11px 13px;border-top:1px dashed var(--line)}
.exam-row:first-child{border-top:0}.exam-date{font:600 11px "IBM Plex Mono",monospace}.exam-slot{color:var(--dim);font:500 10px "IBM Plex Mono",monospace}.exam-course{font-weight:700;font-size:12px}.exam-room{font:700 13px "IBM Plex Mono",monospace;color:var(--teal);text-align:right}
@media(max-width:680px){.exam-row{grid-template-columns:1fr 1fr}.exam-course{grid-column:1}.exam-room{grid-column:2;grid-row:1;text-align:right}}

.search{position:relative}
input,select{width:100%;height:42px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:0 12px;font:500 13px "IBM Plex Mono",monospace;outline:none}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(95,208,194,.08)}
input::placeholder{color:var(--faint);font-family:"IBM Plex Sans",sans-serif}
.sugg{position:absolute;z-index:10;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 14px 35px rgba(0,0,0,.3);display:none;max-height:260px;overflow-y:auto}
.sugg.open{display:block}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px 12px;cursor:pointer;font:500 12px "IBM Plex Mono",monospace}
.sugg button:hover{background:var(--tealDim);color:var(--teal)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--dim);font:500 11px "IBM Plex Mono",monospace}
.stat b{color:var(--text)}
.empty{padding:34px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:14px;background:rgba(25,33,42,.55)}
.day{margin-top:24px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;padding:0 2px 7px;border-bottom:1px solid var(--line)}
.day-name{font-weight:700;color:var(--text)}.day-date{font:500 10px "IBM Plex Mono",monospace;color:var(--faint)}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:9px 0;overflow:hidden}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 13px;background:var(--surface2);border-bottom:1px solid var(--line)}
.slot-title{font:700 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.8px}.slot-time{color:var(--faint);font:500 10px "IBM Plex Mono",monospace}
.course{display:grid;grid-template-columns:170px 1fr 82px;gap:12px;align-items:start;padding:12px 13px;border-top:1px dashed var(--line)}
.course:first-child{border-top:0}.code{font:700 12px "IBM Plex Mono",monospace;color:var(--teal);word-break:break-word}.rolls{display:flex;flex-wrap:wrap;gap:5px}
.roll{font:500 10px "IBM Plex Mono",monospace;color:var(--dim);background:var(--surface2);border:1px solid var(--line);padding:4px 6px;border-radius:6px}
.count{justify-self:end;font:600 10px "IBM Plex Mono",monospace;color:var(--faint);text-align:right}
.note{padding:11px 13px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
.footer{margin-top:34px;padding-top:13px;border-top:1px solid var(--line);color:var(--faint);font-size:11px}
.footer code{font-family:"IBM Plex Mono",monospace;color:var(--dim)}
@media(max-width:680px){.controls{grid-template-columns:1fr}.course{grid-template-columns:1fr;gap:8px}.count{justify-self:start;text-align:left}.top{flex-direction:column}.back{order:2}}
</style>
</head>

<script>
'use strict';
const DB = JSON.parse(document.getElementById('roomData').textContent);
const SLOTS = [['Morning','10:30 AM – 12:30 PM'],['Evening','3:30 PM – 5:30 PM']];
const rollField = document.getElementById('rollField');
const rollInput = document.getElementById('rollInput');
const suggestions = document.getElementById('suggestions');
const dateFilter = document.getElementById('dateFilter');
const slotFilter = document.getElementById('slotFilter');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
let picked = [];
let cursor = -1;
const ALL = Object.keys(DB.rolls).sort();

const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});

DB.dates.forEach((iso,index)=>{
  const option=document.createElement('option');
  option.value=String(index); option.textContent=fmtDate(iso);
  dateFilter.appendChild(option);
});

function save(){try{localStorage.setItem('roomFinderRolls',JSON.stringify(picked));}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('roomFinderRolls')||'[]');if(Array.isArray(v))picked=v.filter(r=>DB.rolls[r]).slice(0,5);}catch(e){}}
function flash(msg){
  const old=rollInput.placeholder;
  rollInput.placeholder=msg;
  rollInput.style.color='var(--rose)';
  setTimeout(()=>{rollInput.placeholder=old;rollInput.style.color='';},2200);
}
function addRoll(roll){
  roll=String(roll||'').trim().toUpperCase();
  if(!roll||picked.includes(roll))return;
  if(!DB.rolls[roll]){flash('No timetable entry found for '+roll);return;}
  if(picked.length>=5){flash('Five roll numbers at a time is the limit');return;}
  picked.push(roll);rollInput.value='';save();renderChips();render();
}
function removeRoll(roll){picked=picked.filter(r=>r!==roll);save();renderChips();render();}
function renderChips(){
  rollField.querySelectorAll('.roll-chip').forEach(el=>el.remove());
  picked.forEach(roll=>{
    const chip=document.createElement('span');chip.className='roll-chip';chip.textContent=roll;
    const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.setAttribute('aria-label','Remove '+roll);btn.onclick=()=>removeRoll(roll);
    chip.appendChild(btn);rollField.insertBefore(chip,rollInput);
  });
  rollInput.placeholder=picked.length?'Add another…':'Roll number, e.g. 2301CS01';
}
function showSuggestions(){
  const q=rollInput.value.trim().toUpperCase();
  if(q.length<2){suggestions.classList.remove('open');suggestions.innerHTML='';cursor=-1;return;}
  const hits=ALL.filter(r=>r.startsWith(q));
  const fallback=hits.length?hits:ALL.filter(r=>r.includes(q));
  suggestions.innerHTML=fallback.slice(0,8).map(r=>'<button type="button" data-roll="'+esc(r)+'">'+esc(r)+'</button>').join('');
  suggestions.querySelectorAll('button').forEach(btn=>btn.addEventListener('mousedown',e=>{e.preventDefault();addRoll(btn.dataset.roll);suggestions.classList.remove('open');}));
  cursor=-1;suggestions.classList.toggle('open',fallback.length>0);
}
function getExams(roll){
  return (DB.rolls[roll]||[]).map(([dateIndex,slot,roomIndex,course])=>({dateIndex,slot,room:DB.rooms[roomIndex],course}));
}
function render(){
  const dateValue=dateFilter.value,slotValue=slotFilter.value;
  if(!picked.length){
    stats.innerHTML='';
    results.innerHTML='<div class="empty"><p>Enter a roll number to find your exam room.</p><p>Example: <code>2301CS01</code></p></div>';
    return;
  }
  let totalExams=0,totalRooms=new Set();
  const html=picked.map(roll=>{
    const exams=getExams(roll).filter(e=>(dateValue==='all'||e.dateIndex===Number(dateValue))&&(slotValue==='all'||e.slot===Number(slotValue))).sort((a,b)=>a.dateIndex-b.dateIndex||a.slot-b.slot);
    exams.forEach(e=>{totalExams++;totalRooms.add(e.room);});
    return '<article class="student-result"><div class="student-head"><span class="student-roll">'+esc(roll)+'</span><span class="student-count">'+exams.length+' exam'+(exams.length===1?'':'s')+'</span></div>'+
      (exams.length?exams.map(e=>'<div class="exam-row"><div><div class="exam-date">'+esc(fmtDate(DB.dates[e.dateIndex]))+'</div><div class="exam-slot">'+SLOTS[e.slot][1]+'</div></div><div class="exam-course">'+esc(e.course.replace(/^\?/,''))+(e.course[0]==='?'?' <span class="none">(unconfirmed)</span>':'')+'</div><div class="exam-room">Room '+esc(e.room)+'</div></div>').join(''):'<div class="note">No exam matches the selected filters for this roll number.</div>')+
    '</article>';
  }).join('');
  stats.innerHTML='<span class="stat"><b>'+picked.length+'</b> student'+(picked.length===1?'':'s')+'</span><span class="stat"><b>'+totalExams+'</b> exam'+(totalExams===1?'':'s')+'</span><span class="stat"><b>'+totalRooms.size+'</b> room'+(totalRooms.size===1?'':'s')+'</span>';
  results.innerHTML=html;
}
rollInput.addEventListener('input',()=>{
  if(rollInput.value.includes(',')){const parts=rollInput.value.split(',');rollInput.value=parts.pop();parts.forEach(addRoll);}
  showSuggestions();
});
rollInput.addEventListener('focus',showSuggestions);
rollInput.addEventListener('keydown',e=>{
  const items=suggestions.classList.contains('open')?[...suggestions.querySelectorAll('button')]:[];
  if(e.key==='ArrowDown'&&items.length){e.preventDefault();cursor=(cursor+1)%items.length;}
  else if(e.key==='ArrowUp'&&items.length){e.preventDefault();cursor=(cursor-1+items.length)%items.length;}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(cursor>=0&&items[cursor])addRoll(items[cursor].dataset.roll);else addRoll(rollInput.value);
    suggestions.classList.remove('open');return;
  } else if(e.key==='Backspace'&&!rollInput.value&&picked.length){picked.pop();save();renderChips();render();return;}
  else if(e.key==='Escape'){suggestions.classList.remove('open');return;}
  items.forEach((el,i)=>el.style.background=i===cursor?'var(--tealDim)':'');
});
rollInput.addEventListener('blur',()=>setTimeout(()=>suggestions.classList.remove('open'),120));
dateFilter.addEventListener('change',render);slotFilter.addEventListener('change',render);

const params=new URLSearchParams(location.search);
load();
const initialRolls=(params.get('rolls')||params.get('roll')||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
initialRolls.slice(0,5).forEach(addRoll);
if(params.get('date')){const idx=DB.dates.indexOf(params.get('date'));if(idx>=0)dateFilter.value=String(idx);}
if(params.get('slot')==='0'||params.get('slot')==='1')slotFilter.value=params.get('slot');
renderChips();render();
rollInput.focus();
</script>
